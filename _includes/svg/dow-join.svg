<svg version="1.1" width="290" height="45" xmlns="http://www.w3.org/2000/svg">
<rect
  width="290" height="45"
  data-fill="background"{% if include.background %} fill="{{ include.background }}"{% endif %} />
<text
  x="50%" y="50%"
  dominant-baseline="central"
  text-anchor="middle"
  data-fill='ink'{% if include.ink %} fill="{{ include.ink }}"{% endif %}
  font-weight="bold"
  data-text='god_name'>{{ include.god_name }}</text>
</svg>